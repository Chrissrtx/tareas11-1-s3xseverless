service: api-s3

org: christianestrada

provider:
  name: aws
  runtime: python3.12
  region: us-east-1

  role: arn:aws:iam::184314369952:role/LabRole

  memorySize: 256
  timeout: 15

functions:
  listarBuckets:
    handler: ListarBuckets.lambda_handler
    memorySize: 256
    events:
      - http:
          path: s3/lista-buckets
          method: get

  listarObjetos:
    handler: ListarObjetos.lambda_handler
    memorySize: 512
    events:
      - http:
          path: s3/bucket/lista-objetos
          method: post

  crearBucket:
    handler: CrearBucket.lambda_handler
    memorySize: 128
    events:
      - http:
          path: s3/crear-bucket
          method: post

  crearDirectorio:
    handler: CrearDirectorio.lambda_handler
    memorySize: 128
    events:
      - http:
          path: s3/crear-directorio
          method: post

  subirArchivo:
    handler: SubirArchivo.lambda_handler
    memorySize: 256
    events:
      - http:
          path: s3/subir-archivo
          method: post